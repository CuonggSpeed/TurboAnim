name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid xz dpkg make
      - run: |
          sed -i '' "s/^Version:.*/Version: 0.1.${{ github.run_number }}/" control
      - run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - run: gmake package FINALPACKAGE=1
      - name: Make repo
        run: |
          mkdir -p site/debs
          cp packages/*.deb site/debs/
          cd site
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -k Packages
          printf 'Origin: CuonggSpeed Repo\nLabel: CuonggSpeed Repo\nSuite: stable\nVersion: 1.0\nCodename: ios\nArchitectures: iphoneos-arm64e iphoneos-arm64 iphoneos-arm\nComponents: main\nDescription: Tweak ca nhan\n' > Release
          echo "TurboAnim repo" > index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
